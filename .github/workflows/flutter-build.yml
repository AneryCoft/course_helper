name: Flutter Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release'
        type: boolean
        default: true
      release_notes:
        description: 'Release 说明（留空则使用 tag 说明或自动生成）'
        type: string
        required: false

env:
  JAVA_VERSION: "17"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions (iOS only)
        if: matrix.platform == 'ios'
        run: |
          flutter --version
          xcodebuild -version
          pod --version || true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using app version: $VERSION"

      - name: Setup Android signing (Android only)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法进行 release 签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/anerycoft.jks
          {
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=../anerycoft.jks"
          } > android/key.properties

      - name: Align deployment target (iOS only)
        if: matrix.platform == 'ios'
        working-directory: ios
        run: |
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            Runner.xcodeproj/project.pbxproj

      - name: Build Android APK (split-per-abi)
        if: matrix.platform == 'android'
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build Android universal APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build iOS release (no codesign)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Rename APKs
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "CourseHelper_${VERSION}_${abi}.apk"
          done
          mv app-release.apk "CourseHelper_${VERSION}_universal.apk"
          ls -lh

      - name: Package unsigned IPA
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          APP="build/ios/iphoneos/Runner.app"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "CourseHelper_${VERSION}_unsigned.ipa" Payload
          ls -lh "CourseHelper_${VERSION}_unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload Android artifacts
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/CourseHelper_*.apk
          if-no-files-found: error

      - name: Upload iOS artifacts
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CourseHelper_*_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure (Android only)
        if: failure() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            build/**/*.log
            android/.gradle/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve tag and notes
        id: meta
        env:
          INPUT_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # 手动触发：使用 pubspec 中的版本号生成 tag
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]' | cut -d'+' -f1)
            TAG="v${VERSION}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            git fetch --tags --force >/dev/null 2>&1 || true
            NOTES=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' 2>/dev/null || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '### 更新内容\n\n- 构建版本 %s\n\n> 详细改动见提交记录。\n' "$TAG")
          fi
          {
            echo "NOTES<<GITHUB_EOF"
            echo "$NOTES"
            echo "GITHUB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Release ${{ steps.meta.outputs.TAG }}
          body: ${{ steps.meta.outputs.NOTES }}
          files: |
            release-assets/android-apk/*.apk
            release-assets/ios-ipa/*.ipa
          fail_on_unmatched_files: false
          # 同名 tag/Release 已存在时更新资产，便于手动重跑
          overwrite_files: true
          make_latest: true
